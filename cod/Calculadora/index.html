<!DOCTYPE html>
<html>
<body>
    <h2>Calculadora Nativa</h2>
    <form action="/" method="POST">
        <input type="number" step="any" name="n1" required>
        <select name="operacao">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="number" step="any" name="n2" required>
        <button type="submit">Calcular</button>
    </form>
</body>
</html>
